name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - azure-migration
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - azure-migration

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Debug Environment Variables
        run: |
          echo "=== DEBUGGING SECRETS ==="
          echo "USE_MOCK value: ${{ vars.USE_MOCK || 'true' }}"
          echo "AZURE_OPENAI_API_KEY exists: ${{ secrets.AZURE_OPENAI_API_KEY != '' }}"
          echo "AZURE_OPENAI_ENDPOINT exists: ${{ secrets.AZURE_OPENAI_ENDPOINT != '' }}"
          echo "AZURE_OPENAI_API_KEY length: ${{ length(secrets.AZURE_OPENAI_API_KEY) }}"
          echo "AZURE_OPENAI_ENDPOINT length: ${{ length(secrets.AZURE_OPENAI_ENDPOINT) }}"
          echo "=== END DEBUG ==="
      - name: Create Azure Functions local.settings.json
        run: |
          cat > api/local.settings.json << EOF
          {
            "IsEncrypted": false,
            "Values": {
              "AzureWebJobsStorage": "",
              "FUNCTIONS_WORKER_RUNTIME": "node",
              "USE_MOCK": "${{ vars.USE_MOCK || 'true' }}",
              "LOG_LEVEL": "${{ vars.LOG_LEVEL || 'info' }}",
              "NODE_ENV": "${{ vars.NODE_ENV || 'production' }}",
              "AZURE_OPENAI_API_KEY": "${{ secrets.AZURE_OPENAI_API_KEY }}",
              "AZURE_OPENAI_ENDPOINT": "${{ secrets.AZURE_OPENAI_ENDPOINT }}"
            }
          }
          EOF
      - name: Set Environment Variables
        run: |
          echo "USE_MOCK=${{ vars.USE_MOCK || 'true' }}" >> $GITHUB_ENV
          echo "LOG_LEVEL=${{ vars.LOG_LEVEL || 'info' }}" >> $GITHUB_ENV
          echo "NODE_ENV=${{ vars.NODE_ENV || 'production' }}" >> $GITHUB_ENV
      - name: Debug - Check if secrets reach this step  
        run: |
          echo "=== SECRETS AVAILABILITY CHECK ==="
          if [ -n "$AZURE_OPENAI_API_KEY" ]; then
            echo "✅ AZURE_OPENAI_API_KEY is available to this step (length: ${#AZURE_OPENAI_API_KEY})"
          else
            echo "❌ AZURE_OPENAI_API_KEY is NOT available to this step"
          fi
          
          if [ -n "$AZURE_OPENAI_ENDPOINT" ]; then
            echo "✅ AZURE_OPENAI_ENDPOINT is available to this step (length: ${#AZURE_OPENAI_ENDPOINT})"  
          else
            echo "❌ AZURE_OPENAI_ENDPOINT is NOT available to this step"
          fi
          echo "=== END SECRETS CHECK ==="
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_GROUND_04DC9DA1E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/frontend" # App source code path
          api_location: "/api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        env:
          USE_MOCK: ${{ vars.USE_MOCK || 'true' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
