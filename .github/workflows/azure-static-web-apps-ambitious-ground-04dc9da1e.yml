name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - azure-migration
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - azure-migration

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Diagnose SWA deployment token (safe)
        shell: bash
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_GROUND_04DC9DA1E }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          token = os.environ.get('SWA_TOKEN', '')
          print(f"SWA token present: {bool(token)}")
          print(f"SWA token length: {len(token)}")
          print(f"SWA token has newline: {('\n' in token) or ('\r' in token)}")
          print(f"SWA token has leading/trailing whitespace: {token != token.strip()}")
          print(f"SWA token is single-line: {bool(re.fullmatch(r'[^\s]+', token))}")
          PY
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_GROUND_04DC9DA1E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/frontend" # App source code path
          api_location: "/api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
        env:
          USE_MOCK: ${{ vars.USE_MOCK || 'true' }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
